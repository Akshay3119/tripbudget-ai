[project]
name = "tripbudget-ai"
version = "1.0.1"
description = "Evidence-aware group trip planning with durable human approval"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=2.0,<4",
  "psycopg[binary,pool]>=3.2,<4", "httpx[socks]>=0.28,<1",
  "chromadb>=1.0,<2", "fastembed>=0.7,<1", "mcp>=1.20,<2",
  "jsonschema>=4.23,<5", "firebase-admin>=6.6,<8", "beautifulsoup4>=4.12,<5", "argon2-cffi>=23,<26",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "playwright>=1.49,<2", "python-pptx>=1,<2", "pypdf>=5,<7", "reportlab>=4,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/tripbudget"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["ASYNC240"]
"evaluation/*.py" = ["ASYNC240"]
"tests/*.py" = ["ASYNC240"]

