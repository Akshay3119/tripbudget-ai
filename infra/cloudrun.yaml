apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: a4-tripbudget
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '2'
        run.googleapis.com/cloudsql-instances: PROJECT:us-central1:a4-tripbudget
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      serviceAccountName: a4-tripbudget@PROJECT.iam.gserviceaccount.com
      containerConcurrency: 8
      timeoutSeconds: 300
      containers:
      - image: us-central1-docker.pkg.dev/PROJECT/a4-tripbudget/app:RELEASE
        ports: [{containerPort: 8080}]
        resources:
          limits: {cpu: '2', memory: 2Gi}
        env:
        - name: TRIPBUDGET_DATABASE_URL
          valueFrom: {secretKeyRef: {name: a4-tripbudget-db, key: latest}}
        - name: TRIPBUDGET_NVIDIA_API_KEY
          valueFrom: {secretKeyRef: {name: a4-tripbudget-nvidia, key: latest}}
        - name: TRIPBUDGET_TAVILY_API_KEY
          valueFrom: {secretKeyRef: {name: a4-tripbudget-tavily, key: latest}}
        - {name: TRIPBUDGET_AUTH_MODE, value: local}
        - {name: TRIPBUDGET_ENABLE_TEST_CONTROLS, value: 'false'}
        - {name: TRIPBUDGET_OLLAMA_URL, value: 'http://127.0.0.1:11435'}
        - {name: TRIPBUDGET_OLLAMA_MODEL, value: 'tripbudget-gemma4-e4b-gguf'}
        startupProbe:
          httpGet: {path: /readyz, port: 8080}
          periodSeconds: 10
          failureThreshold: 24
