services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tripbudget
      POSTGRES_USER: tripbudget
      POSTGRES_PASSWORD: ${TRIPBUDGET_DB_PASSWORD:?Set TRIPBUDGET_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - tripbudget_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripbudget"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  tripbudget_pg:
