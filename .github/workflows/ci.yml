name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: tripbudget, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: tripbudget}
        ports: ['55434:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TRIPBUDGET_DATABASE_URL: postgresql://tripbudget:ci-only@127.0.0.1:55434/tripbudget
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with: {version: '0.9.13'}
    - run: uv sync --frozen
    - run: uv run python -m scripts.manage migrate
    - run: uv run ruff check src scripts evaluation tests
    - run: uv run python -m pytest -q
    - run: uv run python -m scripts.verify_package --source-only
